<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guess</title>
</head>
<body>
  <header>
    <h1 style="color: #0b3c91; margin-bottom: 8px;">TuneCatcher</h1>
    <p style="margin: 0 0 5px 0;">Created by Zoey Later</p>
    <a href="https://github.com/zoeylater/startup" target="_blank" style="display: inline-block; margin: 0 0 20px 0;">
      View GitHub Repository
    </a>
    <nav>
      <a href="index.html">Home</a>
      <a href="login.html">Login</a>
      <a href="about.html">About</a>
      <a href="guess.html">Guess</a>
      <a href="result.html">Result</a>
    </nav>
  </header>

  <main>
    <h2>Guess the Location</h2>
    <audio controls>
      <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg" />
      Your browser does not support the audio element.
    </audio>
    <p>Where in the world do you think this song is from?</p>

    <form action="result.html" method="get">
      <label for="country">Country:</label>
      <input id="country" type="text" name="country" />

      <label for="city">City:</label>
      <input id="city" type="text" name="city" />

      <input type="submit" value="Submit Guess" />
    </form>

    <img
      src="https://images.unsplash.com/photo-1524661135-423995f22d0b?auto=format&fit=crop&w=1200&q=80"
      alt="World map"
      style="display: block; width: 100%; max-width: 500px; height: auto; margin-top: 20px;"
    />
  </main>

  <footer>
    <p>TuneCatcher Demo</p>
  </footer>
</body>
</html>
