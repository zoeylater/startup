<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guess</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="brand-wrap">
      <span class="brand-icon" aria-hidden="true">♫</span>
      <h1 class="brand" style="margin-bottom: 8px;">TuneCatcher</h1>
      <span class="brand-icon brand-icon-plane" aria-hidden="true">✈</span>
    </div>
    <nav style="margin-bottom: 10px;">
      <a href="index.html">Home</a>
      <a href="login.html">Login</a>
      <a href="about.html">About</a>
      <a href="guess.html">Guess</a>
      <a href="result.html">Result</a>
    </nav>
  </header>

  <main>
    <section class="card">
      <h2>Guess the Location</h2>
      <audio controls>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg" />
        Your browser does not support the audio element.
      </audio>
      <p>Where in the world do you think this song is from?</p>

      <form action="result.html" method="get">
        <label for="country">Country:</label>
        <input id="country" type="text" name="country" />

        <label for="city">City:</label>
        <input id="city" type="text" name="city" />

        <input type="submit" value="Submit Guess" />
      </form>

      <img
        src="https://images.unsplash.com/photo-1524661135-423995f22d0b?auto=format&fit=crop&w=1200&q=80"
        alt="World map"
        style="display: block; width: 100%; max-width: 500px; height: auto; margin-top: 20px;"
      />
    </section>
  </main>

  <footer>
    <div class="footer-content">
      <p style="margin: 0;">TuneCatcher Demo</p>
      <p style="margin: 0;">Created by Zoey</p>
      <a class="footer-github" href="https://github.com/zoeylater/startup" target="_blank" rel="noreferrer">GitHub</a>
    </div>
  </footer>
</body>
</html>
