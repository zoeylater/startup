<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guess</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="brand-wrap">
      <span class="brand-icon" aria-hidden="true">♫</span>
      <h1 class="brand" style="margin-bottom: 8px;">TuneCatcher</h1>
      <span class="brand-icon brand-icon-plane" aria-hidden="true">✈</span>
    </div>
    <nav style="margin-bottom: 10px;">
      <a href="index.html">Home</a>
      <a href="login.html">Login</a>
      <a href="about.html">About</a>
      <a href="guess.html">Guess</a>
      <a href="result.html">Result</a>
    </nav>
  </header>

  <main>
    <section class="guess-card">
      <div class="result-inner-panel">
        <h2>Guess the Location</h2>
        <audio controls>
          <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg" />
          Your browser does not support the audio element.
        </audio>
        <p>Where in the world do you think this song is from?</p>

        <form action="result.html" method="get" class="guess-form">
          <label for="country">Country:</label>
          <input id="country" type="text" name="country" />

          <label for="city">City:</label>
          <input id="city" type="text" name="city" />

          <input type="submit" value="Submit Guess" />
        </form>

        <img
          src="map.jpg"
          alt="World map"
          style="display: block; width: 100%; max-width: 500px; height: auto; margin: 20px auto 0;"
        />
      </div>
    </section>
  </main>

  <footer>
    <div class="footer-content">
      <p style="margin: 0;">TuneCatcher Demo</p>
      <p class="footer-signature" style="margin: 0;">Created by Zoey</p>
      <a class="footer-github" href="https://github.com/zoeylater/startup" target="_blank" rel="noreferrer">GitHub</a>
    </div>
  </footer>
</body>
</html>
