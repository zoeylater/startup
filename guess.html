<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guess</title>

<body>
  <header>
    <h1>TuneCatcher</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="guess.html">Guess</a>

  </header>

  <main>
    <h2>Guess the Location</h2>
    <p>Song clip: Daily mystery track snippet</p>
    <p>Where in the world do you think this song is from?</p>

    <form action="result.html" method="get">
      <label for="country">Country:</label>
      <input id="country" type="text" name="country" />

      <label for="city">City:</label>
      <input id="city" type="text" name="city" />

      <input type="submit" value="Submit Guess" />
    </form>

    <svg
      viewBox="0 0 800 400"
      aria-label="Simple world map"
      style="display: block; width: 100%; max-width: 500px; height: auto; margin-top: 20px; border: 1px solid #ccc; background: #f5f7fb;"
    >
      <rect width="800" height="400" fill="#f5f7fb" />
      <path d="M70 120 L120 90 L160 85 L185 100 L210 120 L194 150 L160 170 L120 160 L90 145 Z" fill="#dfe8f5" stroke="#8aa0b7" stroke-width="2" />
      <path d="M210 135 L265 110 L310 95 L350 115 L360 145 L335 180 L280 185 L230 170 Z" fill="#dfe8f5" stroke="#8aa0b7" stroke-width="2" />
      <path d="M370 120 L430 95 L470 100 L505 130 L490 175 L440 185 L395 170 Z" fill="#dfe8f5" stroke="#8aa0b7" stroke-width="2" />
      <path d="M500 135 L560 120 L620 128 L665 145 L650 170 L600 185 L545 175 Z" fill="#dfe8f5" stroke="#8aa0b7" stroke-width="2" />
      <path d="M580 205 L640 200 L670 225 L655 255 L610 270 L585 245 Z" fill="#dfe8f5" stroke="#8aa0b7" stroke-width="2" />
      <path d="M315 210 L360 195 L390 215 L382 250 L340 265 L310 245 Z" fill="#dfe8f5" stroke="#8aa0b7" stroke-width="2" />
      <path d="M135 250 L185 240 L210 265 L195 302 L150 310 L120 282 Z" fill="#dfe8f5" stroke="#8aa0b7" stroke-width="2" />
      <path d="M445 250 L500 240 L545 250 L535 285 L485 300 L455 282 Z" fill="#dfe8f5" stroke="#8aa0b7" stroke-width="2" />
      <circle cx="175" cy="270" r="4" fill="#8aa0b7" />
      <circle cx="390" cy="190" r="4" fill="#8aa0b7" />
      <circle cx="620" cy="150" r="4" fill="#8aa0b7" />
    </svg>
  </main>

  <footer>
    <p>TuneCatcher Demo</p>
  </footer>
</body>
</html>
