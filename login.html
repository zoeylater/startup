<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | TuneCatcher</title>
</head>
<body>
  <header>
    <h1 style="color: #0b3c91;">TuneCatcher</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="login.html">Login</a>
      <a href="about.html">About</a>
      <a href="guess.html">Guess</a>

  <main>
    <section>
      <h2 style="color: #000000;">Authentication</h2>
      <p>Sign in to continue your daily music challenge.</p>
    </section>

    <section>
      <form>
        <div>
          <label for="username">Username</label><br />
          <input id="username" type="text" name="username" />
        </div>

        <div>
          <label for="email">Email</label><br />
          <input id="email" type="email" name="email" />
        </div>

        <div>
          <label for="password">Password</label><br />
          <input id="password" type="password" name="password" />
        </div>

        <div>
          <input type="submit" value="Create Account" />
        </div>
      </form>
      <p>Logged in as: Maya</p>
    </section>
  </main>

  <footer>
    <p>TuneCatcher Demo</p>
  </footer>
