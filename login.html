<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | TuneCatcher</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1 style="color: #0b3c91; margin-bottom: 8px;">TuneCatcher</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="login.html">Login</a>
      <a href="about.html">About</a>
      <a href="guess.html">Guess</a>
      <a href="result.html">Result</a>
    </nav>
  </header>

  <main>
    <section class="card">
      <h2>Authentication</h2>
      <p>Sign in to continue your daily music challenge.</p>
    </section>

    <section class="card" style="margin-top: 1.5rem;">
      <form action="index.html" method="post">
        <div>
          <label for="username">Username</label>
          <input id="username" type="text" name="username" />
        </div>

        <div>
          <label for="email">Email</label>
          <input id="email" type="email" name="email" />
        </div>

        <div>
          <label for="password">Password</label>
          <input id="password" type="password" name="password" />
        </div>

        <div>
          <input type="submit" value="Create Account" />
        </div>
      </form>
      <p>Logged in as: Maya</p>
    </section>
  </main>

  <footer style="margin-top: 30px; padding-top: 20px; border-top: 1px solid #ddd; text-align: center;">
    <p style="margin: 0;">TuneCatcher Demo</p>
    <p style="margin: 8px 0 0;">Created by Zoey</p>
    <a href="https://github.com/zoeylater/startup" target="_blank" rel="noreferrer" style="display: inline-block; margin-top: 8px;">
      GitHub
    </a>
  </footer>
</body>
</html>
