<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | TuneCatcher</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="brand-wrap">
      <span class="brand-icon" aria-hidden="true">♫</span>
      <h1 class="brand" style="margin-bottom: 8px;">TuneCatcher</h1>
      <span class="brand-icon brand-icon-plane" aria-hidden="true">✈</span>
    </div>
    <nav style="margin-bottom: 10px;">
      <a href="index.html">Home</a>
      <a href="login.html">Login</a>
      <a href="about.html">About</a>
      <a href="guess.html">Guess</a>
      <a href="result.html">Result</a>
    </nav>
  </header>

  <main>
    <section class="card">
      <h2>Authentication</h2>
      <p>Sign in to continue your daily music challenge.</p>
    </section>

    <section class="card" style="margin-top: 1.5rem;">
      <form action="index.html" method="post">
        <div>
          <label for="username">Username</label>
          <input id="username" type="text" name="username" />
        </div>

        <div>
          <label for="email">Email</label>
          <input id="email" type="email" name="email" />
        </div>

        <div>
          <label for="password">Password</label>
          <input id="password" type="password" name="password" />
        </div>

        <div>
          <input type="submit" value="Create Account" />
        </div>
      </form>
      <p>Logged in as: Maya</p>
    </section>
  </main>

  <footer>
    <div class="footer-content">
      <p style="margin: 0;">TuneCatcher Demo</p>
      <p style="margin: 0;">Created by Zoey</p>
      <a class="footer-github" href="https://github.com/zoeylater/startup" target="_blank" rel="noreferrer">GitHub</a>
    </div>
  </footer>
</body>
</html>
