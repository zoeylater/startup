<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Result</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="brand-wrap">
      <span class="brand-icon" aria-hidden="true">♫</span>
      <h1 class="brand" style="margin-bottom: 8px;">TuneCatcher</h1>
      <span class="brand-icon brand-icon-plane" aria-hidden="true">✈</span>
    </div>
    <nav style="margin-bottom: 10px;">
      <a href="index.html">Home</a>
      <a href="login.html">Login</a>
      <a href="about.html">About</a>

      <a href="result.html">Result</a>

  <main>
    <section class="result-card">
      <div class="result-inner-panel">
        <p class="result-badge">Nice!</p>
        <p class="result-subtitle">Here are your results:</p>
        <p class="result-line">Your guess: Kenya, Nairobi</p>

      </div>
    </section>
  </main>

  <footer>
    <div class="footer-content">
      <p style="margin: 0;">TuneCatcher Demo</p>
      <p class="footer-signature" style="margin: 0;">Created by Zoey</p>
      <a class="footer-github" href="https://github.com/zoeylater/startup" target="_blank" rel="noreferrer">GitHub</a>
