<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Result</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="brand-wrap">
      <span class="brand-icon" aria-hidden="true">♫</span>
      <h1 class="brand" style="margin-bottom: 8px;">TuneCatcher</h1>
      <span class="brand-icon brand-icon-plane" aria-hidden="true">✈</span>
    </div>
    <nav>
      <a href="index.html">Home</a>
      <a href="login.html">Login</a>
      <a href="about.html">About</a>
      <a href="guess.html">Guess</a>
      <a href="result.html">Result</a>
    </nav>
  </header>

  <main class="result-page">
    <section class="result-card">
      <div class="result-inner-panel">
        <p class="result-badge">Nice!</p>
        <p class="result-subtitle">Here are your results:</p>

        <div class="result-stats">
          <div class="result-metric">
            <span class="result-metric-label">Your guess</span>
            <span class="result-metric-value guess-value">Kenya, Nairobi</span>
          </div>
          <div class="result-metric">
            <span class="result-metric-label">Actual location</span>
            <span class="result-metric-value actual-value">Kenya, Nairobi</span>
          </div>
          <div class="result-metric result-score-box">
            <span class="result-metric-label">Score</span>
            <span class="result-metric-value score-value">980 points</span>
          </div>
        </div>
      </div>
    </section>

    <aside class="result-board-card">
      <h3>Top scores</h3>
      <ol>
        <li><span>Jules</span><strong>980</strong></li>
        <li><span>Aria</span><strong>950</strong></li>
        <li><span>Maya</span><strong>920</strong></li>
      </ol>
    </aside>
  </main>

  <footer>
    <div class="footer-content">
      <p style="margin: 0;">TuneCatcher Demo</p>
      <p class="footer-signature" style="margin: 0;">Created by Zoey</p>
      <a class="footer-github" href="https://github.com/zoeylater/startup" target="_blank" rel="noreferrer">GitHub</a>
    </div>
  </footer>
</body>
</html>
