<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guess</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-light">
  <header class="site-header">
    <div class="brand-wrap">
      <span class="brand-icon" aria-hidden="true">♫</span>
      <h1 class="brand" style="margin-bottom: 8px;">TuneCatcher</h1>
      <span class="brand-icon brand-icon-plane" aria-hidden="true">✈</span>
    </div>
    <nav>
      <a href="index.html">Home</a>
      <a href="login.html">Login</a>
      <a href="about.html">About</a>
      <a href="guess.html">Guess</a>
      <a href="result.html">Result</a>
    </nav>
  </header>

  <main class="container py-4">
    <section class="guess-card shadow-sm border-0 rounded-4">
      <div class="result-inner-panel p-3 p-md-4">
        <h2 class="mb-3">Guess the Location</h2>
        <audio controls class="d-block w-100 mb-3">
          <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg" />
          Your browser does not support the audio element.
        </audio>
        <p class="mb-3">Where in the world do you think this song is from?</p>

        <form action="result.html" method="get" class="guess-form row g-3">
          <div class="col-12 col-md-6">
            <label for="country" class="form-label">Country:</label>
            <input id="country" type="text" name="country" class="form-control" />
          </div>

          <div class="col-12 col-md-6">
            <label for="city" class="form-label">City:</label>
            <input id="city" type="text" name="city" class="form-control" />
          </div>

          <div class="col-12">
            <input type="submit" value="Submit Guess" class="btn btn-primary px-4" />
          </div>
        </form>

        <img
          src="map.jpg"
          alt="World map"
          class="guess-map-image img-fluid mt-4 mx-auto d-block"
        />
      </div>
    </section>
  </main>

  <footer>
    <div class="footer-content">
      <p style="margin: 0;">TuneCatcher Demo</p>
      <p class="footer-signature" style="margin: 0;">Created by Zoey</p>
      <a class="footer-github" href="https://github.com/zoeylater/startup" target="_blank" rel="noreferrer">GitHub</a>
    </div>
  </footer>
</body>
</html>
