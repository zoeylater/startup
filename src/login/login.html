<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | TuneCatcher</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-light">
  <header class="site-header">
    <div class="brand-wrap">
      <span class="brand-icon" aria-hidden="true">♫</span>
      <h1 class="brand" style="margin-bottom: 8px;">TuneCatcher</h1>
      <span class="brand-icon brand-icon-plane" aria-hidden="true">✈</span>
    </div>
    <nav>
      <a href="index.html">Home</a>
      <a href="login.html">Login</a>
      <a href="about.html">About</a>
      <a href="guess.html">Guess</a>
      <a href="result.html">Result</a>
    </nav>
  </header>

  <main class="container py-4">
    <section class="card auth-card shadow-sm border-0 rounded-4">
      <div class="auth-card-inner p-3 p-md-4">
        <h2 class="mb-3">Authentication</h2>
        <p class="mb-0">Sign in to continue your daily music challenge.</p>
      </div>
    </section>

    <section class="card auth-form-card shadow-sm border-0 rounded-4 mt-4">
      <div class="auth-form-card-inner p-3 p-md-4">
        <form action="index.html" method="post" class="row g-3">
          <div class="col-12">
            <label for="username" class="form-label">Username</label>
            <input id="username" type="text" name="username" class="form-control" />
          </div>

          <div class="col-12">
            <label for="email" class="form-label">Email</label>
            <input id="email" type="email" name="email" class="form-control" />
          </div>

          <div class="col-12">
            <label for="password" class="form-label">Password</label>
            <input id="password" type="password" name="password" class="form-control" />
          </div>

          <div class="col-12">
            <input type="submit" value="Create Account" class="btn btn-primary px-4" />
          </div>
        </form>
        <p class="mb-0 mt-3">Logged in as: Maya</p>
      </div>
    </section>
  </main>

  <footer>
    <div class="footer-content">
      <p style="margin: 0;">TuneCatcher Demo</p>
      <p class="footer-signature" style="margin: 0;">Created by Zoey</p>
      <a class="footer-github" href="https://github.com/zoeylater/startup" target="_blank" rel="noreferrer">GitHub</a>
    </div>
  </footer>
</body>
</html>
